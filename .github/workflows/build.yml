name: Build Project

on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build Project
        run: bun run generate:ios
      - name: Archive Build Artifacts
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: sky-build-ios-${{ github.run_id }}
          path: dist/
          overwrite: true
      - name: Attest Build Artifacts
        if: success() || failure()
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: sky-build-ios-${{ github.run_id }}
          subject-digest: sha256:${{ steps.archive.outputs.artifact-digest }}

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build Project
        run: bun run generate:android
      - name: Archive Build Artifacts
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: sky-build-android-${{ github.run_id }}
          path: dist/
          overwrite: true
      - name: Attest Build Artifacts
        if: success() || failure()
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: sky-build-android-${{ github.run_id }}
          subject-digest: sha256:${{ steps.archive.outputs.artifact-digest }}

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run unit tests with Coverage
        run: bun run test:unit:coverage
      - name: Upload to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earth-app/sky
          fail_ci_if_error: false
          flags: unit
          files: |
            coverage/lcov.info
            coverage/coverage-final.json
      - name: Archive Unit Coverage Artifacts
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-artifacts-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unit

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build Test Build
        run: bun run build:e2e
      - name: Run E2E tests with Coverage
        run: bun run test:e2e:coverage
        env:
          CI: true
          COVERAGE: '1'
          PLAYWRIGHT_PROD: '1'
      - name: Upload Playwright Artifacts (Failure)
        if: ${{ failure() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-results/
            .coverage/
          retention-days: 7
      - name: Upload to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earth-app/sky
          fail_ci_if_error: false
          flags: e2e-mocked
          files: |
            coverage/lcov.info
            coverage/coverage-final.json
      - name: Archive Coverage Artifacts
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-artifacts-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unit

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps webkit
      - name: Build Test Build
        run: bun run build:e2e
      - name: Run E2E tests (WebKit)
        run: bun run test:e2e:webkit
        env:
          CI: true
          PLAYWRIGHT_PROD: '1'
      - name: Upload Playwright Artifacts (Failure)
        if: ${{ failure() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit
          path: |
            playwright-report/
            playwright-results/
          retention-days: 7

  compile-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [unit, build-ios]

    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # cap sync hard-fails without webDir, and needs only orders jobs, so build here
      - name: Build Project
        run: bun run generate:ios
      - name: Sync Capacitor iOS Project
        run: bunx cap sync ios
      # -destination beats -sdk: the App target embeds Watch.app (@capgo/capacitor-watch)
      # and -sdk iphonesimulator breaks a project with a watch target
      - name: Compile iOS App
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data-ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      # ditto keeps the bundle's symlinks and permissions; uploading App.app raw would not
      - name: Zip App Bundle
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/derived-data-ios/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/App-Debug-iphonesimulator.zip"
      - name: Archive Compiled App
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: sky-compile-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/App-Debug-iphonesimulator.zip
          overwrite: true
      - name: Attest Compiled App
        if: success() || failure()
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: sky-compile-ios-${{ github.run_id }}
          subject-digest: sha256:${{ steps.archive.outputs.artifact-digest }}

  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit, build-android]

    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      # 21 because the capacitor plugin modules pin kotlin jvmToolchain(21)
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # cap sync hard-fails without webDir, and needs only orders jobs, so build here
      - name: Build Project
        run: bun run generate:android
      - name: Sync Capacitor Android Project
        run: bunx cap sync android
      - name: Compile Android App
        run: ./gradlew --console=plain assembleDebug
        working-directory: android
      - name: Archive Compiled APK
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: sky-compile-android-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
      - name: Attest Compiled APK
        if: success() || failure()
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: sky-compile-android-${{ github.run_id }}
          subject-digest: sha256:${{ steps.archive.outputs.artifact-digest }}

  maestro-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    # ordering only, NOT artifact reuse: generate:ios bakes the production base urls, so
    # maestro rebuilds the web bundle with its own dotenv. no point booting a simulator
    # when the native project cannot compile
    needs: [unit, compile-ios]

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: '2.7.0'
      - name: Run Maestro Gate Flows (iOS Simulator)
        run: bun run maestro:ios
      - name: Archive Maestro Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-${{ github.run_id }}
          path: |
            /tmp/sky-maestro/ios/report.xml
            /tmp/sky-maestro/ios/artifacts
            /tmp/sky-maestro/mock-server.log
          retention-days: 7

  maestro-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # same as maestro-ios: ordering only, the emulator lane rebuilds against 10.0.2.2 mocks
    needs: [unit, compile-android]

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      # 21 because this lane runs assembleDebug and the capacitor plugin modules pin
      # kotlin jvmToolchain(21); relying on the runner image shipping one is fragile
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: '2.7.0'
      - name: Run Maestro Gate Flows (Android Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bun run maestro:android
      - name: Archive Maestro Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-${{ github.run_id }}
          path: |
            /tmp/sky-maestro/android/report.xml
            /tmp/sky-maestro/android/artifacts
            /tmp/sky-maestro/mock-server.log
          retention-days: 7
