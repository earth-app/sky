name: Build Project

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build Project
        run: bun run generate:ios
      - name: Archive Build Artifacts
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: sky-build-ios-${{ github.run_id }}
          path: dist/
          overwrite: true
      - name: Attest Build Artifacts
        if: ${{ steps.archive.outputs.artifact-digest != '' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: sky-build-ios-${{ github.run_id }}
          subject-digest: sha256:${{ steps.archive.outputs.artifact-digest }}

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build Project
        run: bun run generate:android
      - name: Archive Build Artifacts
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: sky-build-android-${{ github.run_id }}
          path: dist/
          overwrite: true
      - name: Attest Build Artifacts
        # only when the archive actually produced a digest: on a failed build this step used to
        # emit "subject-digest must be in the format" and bury the real compile error
        if: ${{ steps.archive.outputs.artifact-digest != '' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: sky-build-android-${{ github.run_id }}
          subject-digest: sha256:${{ steps.archive.outputs.artifact-digest }}

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run unit tests with Coverage
        run: bun run test:unit:coverage
      - name: Upload to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earth-app/sky
          fail_ci_if_error: false
          flags: unit
          files: |
            coverage/lcov.info
            coverage/coverage-final.json
      - name: Archive Unit Coverage Artifacts
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-artifacts-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit

    # 361 specs on one runner took 42m. the runners are 2-core, so `workers` is already at
    # capacity (raising it starves hydration); more runners is the only lever left
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build Test Build
        run: bun run build:e2e
      - name: Run E2E tests with Coverage
        run: bun run test:e2e:coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true
          COVERAGE: '1'
          PLAYWRIGHT_PROD: '1'
      - name: Upload Playwright Artifacts (Failure)
        # not gated on push: branch pushes no longer start a run, so gating this would leave a
        # failing pull request with no trace, screenshot or video to diagnose from
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard${{ matrix.shard }}
          path: |
            playwright-report/
            playwright-results/
            .coverage/
          retention-days: 7
      - name: Upload to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earth-app/sky
          fail_ci_if_error: false
          flags: e2e-mocked
          files: |
            coverage/lcov.info
            coverage/coverage-final.json
      - name: Archive Coverage Artifacts
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-artifacts-${{ github.run_id }}-shard${{ matrix.shard }}
          path: coverage/
          retention-days: 14

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps webkit
      - name: Build Test Build
        run: bun run build:e2e
      - name: Run E2E tests (WebKit)
        run: bun run test:e2e:webkit --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true
          PLAYWRIGHT_PROD: '1'
      - name: Upload Playwright Artifacts (Failure)
        # not gated on push: branch pushes no longer start a run, so gating this would leave a
        # failing pull request with no trace, screenshot or video to diagnose from
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit-shard${{ matrix.shard }}
          path: |
            playwright-report/
            playwright-results/
          retention-days: 7

  native-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    needs: [unit, build-ios]

    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: '2.7.0'
      - name: Build Project
        run: bun run generate:ios
      - name: Sync Capacitor iOS Project
        run: bunx cap sync ios
      - name: Compile iOS App
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data-ios" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build
      - name: Report Disk Usage
        if: ${{ always() }}
        run: |
          df -h /
          du -sh "$RUNNER_TEMP/derived-data-ios" 2> /dev/null || true
      - name: Zip App Bundle
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/derived-data-ios/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/App-Debug-iphonesimulator.zip"
      - name: Archive Compiled App
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: sky-compile-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/App-Debug-iphonesimulator.zip
          overwrite: true
      - name: Attest Compiled App
        if: ${{ steps.archive.outputs.artifact-digest != '' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: sky-compile-ios-${{ github.run_id }}
          subject-digest: sha256:${{ steps.archive.outputs.artifact-digest }}
      - name: Run Maestro Gate Flows (iOS Simulator)
        timeout-minutes: 30
        run: bun run maestro:ios
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
          MAESTRO_DERIVED_DATA: ${{ runner.temp }}/derived-data-ios
      - name: Archive Maestro Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-${{ github.run_id }}
          path: |
            /tmp/sky-maestro/ios/report.xml
            /tmp/sky-maestro/ios/artifacts
            /tmp/sky-maestro/mock-server.log
          retention-days: 7

  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit, build-android]

    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
          registries: |
            https://registry.npmjs.org/
            @earth-app:https://npm.pkg.github.com|$GITHUB_TOKEN
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: '2.7.0'
      - name: Build Project
        run: bun run generate:android
      - name: Sync Capacitor Android Project
        run: bunx cap sync android
      - name: Compile Android App
        run: ./gradlew --console=plain assembleDebug
        working-directory: android
      - name: Archive Compiled APK
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: sky-compile-android-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
      - name: Attest Compiled APK
        if: ${{ steps.archive.outputs.artifact-digest != '' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: sky-compile-android-${{ github.run_id }}
          subject-digest: sha256:${{ steps.archive.outputs.artifact-digest }}
      - name: Pre-install the Android emulator package
        # best-effort ONLY: on the happy path this warms the package so the action's own
        # retry-less install is a no-op, but it must never be the step that fails the job
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2> /dev/null | head -1)"
          fi
          if [ -z "$sdkmanager" ]; then
            echo "::warning::sdkmanager not found under $sdk_root; leaving the emulator install to the runner action"
            exit 0
          fi
          for attempt in 1 2 3; do
            if "$sdkmanager" --install emulator --channel=0 > /dev/null; then
              echo "emulator package ready (attempt $attempt)"
              exit 0
            fi
            echo "emulator sdk download failed (attempt $attempt of 3)"
            sleep 15
          done
          echo "::warning::could not pre-download the emulator package; the runner action will try once more"
          exit 0
      - name: Run Maestro Gate Flows (Android Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -memory 4096
          script: bun run maestro:android
      - name: Archive Maestro Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-${{ github.run_id }}
          path: |
            /tmp/sky-maestro/android/report.xml
            /tmp/sky-maestro/android/artifacts
            /tmp/sky-maestro/mock-server.log
          retention-days: 7
