appId: com.earthapp.sky
name: Deny A System Permission Dialog
tags:
  - gate
---
# android only, and a HARD wait rather than a `when: visible` conditional. launchApp's `deny` maps
# to pm revoke, which leaves the permission RE-PROMPTABLE, so the app's own requestPermissions()
# always raises the OS dialog on this path - it is guaranteed, not incidental. a conditional here
# races it: waitForAnimationToEnd returns once animations settle, which is before the async
# permission request fires, so the check skipped and the dialog then blocked every later
# assertion with a misleading "not visible" on content the screenshot plainly showed.
#
# ios never reaches this: setPermissions writes the TCC database directly and no prompt appears.
#
# tapping through is also the honest deny path - a real user denies here, not in appops.
# `Don.t allow` is a regex on purpose: the button uses a curly apostrophe (U+2019), and matching
# it literally would depend on this file's encoding surviving every editor that touches it
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: Don.t allow
          timeout: 30000
          label: The app re-requested, so the OS prompt is up
      - tapOn:
          text: Don.t allow
      - waitForAnimationToEnd:
          timeout: 5000
