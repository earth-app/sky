appId: com.earthapp.sky
name: Sign In With A Password
tags:
  - gate
env:
  SKY_USER: testuser
  SKY_PASSWORD: MaestroPass_1
---
- runFlow:
    file: launch-clean.yml

- tapOn:
    text: Login
    label: Open the login page
# android's a11y bridge folds UFormField's required marker into the label's own text node
# ("Username or Email*") while ios keeps it separate, and maestro matches on literal equality
# or a FULL regex, never a substring, so every required label needs the optional asterisk
- extendedWaitUntil:
    visible: 'Username or Email\*?'
    timeout: 20000

# each field is picked by its own aria-label, anchored below the UFormField label so the pair
# stays unambiguous on ios too, where the label carries no asterisk to tell them apart. the iOS
# keyboard covers the lower half of the form and hideKeyboard is unsupported in a WKWebView,
# so the page heading doubles as a non-interactive blur target between fields
- tapOn:
    text: Username or Email
    below:
      text: 'Username or Email\*?'
- inputText: ${SKY_USER}
# best-effort, never fatal: focusing the field can scroll the heading out of the tree, and this
# only exists to drop a keyboard that may not be up. tapping the next field blurs this one anyway
- runFlow:
    when:
      visible:
        text: Login
        above:
          text: 'Username or Email\*?'
    commands:
      - tapOn:
          text: Login
          above:
            text: 'Username or Email\*?'
          label: Blur the field so the keyboard drops
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: Password
    below:
      text: 'Password\*?'
- inputText: ${SKY_PASSWORD}
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: Login
    below:
      text: 'Password\*?'
    label: Submit the credentials form
- waitForAnimationToEnd:
    timeout: 5000

# a clean container chains the text-size sheet on the dashboard, which only opens for an
# authenticated user, so it doubles as the "login landed" assertion
- extendedWaitUntil:
    visible: 'How does this Look\?'
    timeout: 40000
    label: Authenticated and on the dashboard
- tapOn:
    text: Skip for Now
- waitForAnimationToEnd:
    timeout: 5000

# closing the text-size sheet hands off to the welcome tour
- extendedWaitUntil:
    visible: Welcome to The Earth App
    timeout: 20000
    label: Welcome tour auto-started

# the X persists a RESUME point, not completion (MSiteTour only calls markCompleted on the finished
# path), so the tour can come back on a later relaunch - _shared/settle-after-launch.yml clears it
# there. walking to Finish to make it durable was tried and reverted: `repeat while visible: Next`
# matches case-insensitively and NEXT also appears on non-tour screens, so the loop tapped its way
# into a signed-out state and cost ~1min per flow
- tapOn:
    text: Close tour
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: Open Your Profile
    timeout: 20000
    label: Dashboard identity strip is interactive
