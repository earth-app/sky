appId: com.earthapp.sky
name: Clean Launch
tags:
  - gate
---
# a system alert left by an earlier flow covers the whole accessibility tree, which would
# cascade one flake into every later flow. nothing of ours is on screen yet, so any Cancel
# here belongs to the OS
- runFlow:
    when:
      visible:
        text: Cancel
    commands:
      - tapOn:
          text: Cancel
      - waitForAnimationToEnd:
          timeout: 5000

# no permissions map here: maestro does not interpolate env vars into permission values, and
# every flow that cares about a grant state sets it explicitly with setPermissions
- launchApp:
    appId: com.earthapp.sky
    clearState: true
    clearKeychain: true
    stopApp: true
    label: Cold launch onto a wiped app container

# launchAutoHide is false and SplashScreen.hide() only fires at the end of index.vue's
# onMounted, so any content at all proves the boot chain completed. the first-run modal
# also proves the Preferences prefix was cleared (hasOpened is a Preferences key that
# survives a plain localStorage wipe)
- extendedWaitUntil:
    visible: Welcome to The Earth App!
    timeout: 40000
    label: Splash cleared and the first-run onboarding modal rendered

# the modal covers the index page, and its ionic backdrop carries no accessible name, so
# the second launch is what gets us to the anonymous CTA; it also re-checks the splash on
# the launch that historically stalled and proves hasOpened persisted
- stopApp:
    appId: com.earthapp.sky
- launchApp:
    appId: com.earthapp.sky
    clearState: false
    label: Second launch on the same container

- extendedWaitUntil:
    visible: Sign Up
    timeout: 40000
    label: Splash cleared again, straight onto the anonymous CTA
- assertVisible:
    text: The Earth App
    label: Webview actually painted, not a blank shell
- assertVisible:
    text: Find your Novelty, Try New Things, Discover the World
- assertVisible:
    text: Login
- assertNotVisible:
    text: Welcome to The Earth App!
    label: hasOpened survived in Preferences, so first-run did not replay
