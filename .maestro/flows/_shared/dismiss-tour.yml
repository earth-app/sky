appId: com.earthapp.sky
name: Dismiss The Welcome Tour
tags:
  - gate
---
# a HARD wait, not a `when: visible` conditional. closing the tour with the X persists a RESUME
# point rather than completion, so it comes back on every relaunch - and it resumes asynchronously
# once boot settles, which is *after* waitForAnimationToEnd returns. a conditional therefore
# checked too early, skipped, and the tour then appeared midway through the flow and dropped the
# whole screen behind it out of the android accessibility tree, failing later assertions with a
# misleading "not visible" on content the screenshot plainly showed.
#
# so: block until it is actually up, then dismiss it. every relaunch resumes it, which is what
# makes waiting safe rather than a hang risk
- extendedWaitUntil:
    visible: Welcome to The Earth App
    timeout: 40000
    label: The tour resumed after the relaunch, as an unfinished tour always does
- tapOn:
    text: Close tour
- waitForAnimationToEnd:
    timeout: 5000
