appId: com.earthapp.sky
name: Cold Launch Clears The Splash
tags:
  - gate
  - s2
---
- runFlow:
    file: ../_shared/launch-clean.yml

- assertNotVisible:
    text: You're offline
    label: Boot did not come up in the offline branch

# a webview that boots and then goes blank on the first route change is the other half
# of this bug class, so push a route and come back
- tapOn:
    text: Login
- extendedWaitUntil:
    visible: 'Username or Email\*?'
    timeout: 20000
    label: First in-app route rendered
- tapOn:
    text: Back
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: Find your Novelty, Try New Things, Discover the World
    timeout: 20000
    label: Returned to a painted index, not a blank webview
