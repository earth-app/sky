appId: com.earthapp.sky
name: Sign In And Browse Every Tab
tags:
  - gate
---
- runFlow:
    file: ../_shared/sign-in.yml

- assertVisible:
    text: Time Outside
    label: Dashboard Today card rendered

# discover first: the dashboard explore strip also carries a "Quests" accessible name,
# so leaving the dashboard makes the tab-bar button the only match
- tapOn:
    text: Discover
# ion-searchbar hardcodes aria-label="search text" on its native input and inherits only
# lang/dir from the host, so neither our aria-label nor the "Explore..." placeholder is
# reachable; android exposes only that generic name. the selected tab proves the route
# committed, the searchbar proves the page actually painted rather than going blank
- extendedWaitUntil:
    visible:
      text: Discover
      selected: true
    timeout: 20000
    label: Discover tab selected
- assertVisible:
    text: search text
    label: Discover searchbar painted

- tapOn:
    text: Quests
- extendedWaitUntil:
    visible: Challenge a Friend
    timeout: 20000
    label: Quests tab rendered

- tapOn:
    text: Profile
- extendedWaitUntil:
    visible: Edit Profile
    timeout: 20000
    label: Profile tab rendered

- tapOn:
    text: Dashboard
- extendedWaitUntil:
    visible: Time Outside
    timeout: 20000
    label: Back on the dashboard with tab state intact

# the create FAB is its own native-adjacent surface: an IonFabList that only exists
# once the FAB is activated
- tapOn:
    text: Create Content
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: New Prompt
- assertVisible:
    text: New Article
- assertVisible:
    text: New Event
- tapOn:
    text: New Prompt
- extendedWaitUntil:
    visible: Create Prompt
    timeout: 20000
    label: Create flow reachable from the FAB
