appId: com.earthapp.sky
name: Location Permission Deny Then Grant
tags:
  - gate
---
- runFlow:
    file: ../_shared/sign-in.yml

# `location` is the one permission whose values differ by platform: simctl privacy takes the
# CLLocation vocabulary (never / inuse / always), Android's appops takes allow / deny. maestro
# does not interpolate env vars into permission values, so the split has to be explicit
- runFlow:
    when:
      platform: iOS
    commands:
      - setPermissions:
          appId: com.earthapp.sky
          permissions:
            location: never
- runFlow:
    when:
      platform: Android
    commands:
      # android force-stops a process whose runtime permissions change, and launchApp grants
      # everything unless this map says otherwise, so the state and the relaunch are one step.
      # clearState stays off to keep the session
      - launchApp:
          appId: com.earthapp.sky
          clearState: false
          permissions:
            location: deny
          label: Relaunch with location denied
      # the dashboard's nearby widget asks for a fix during boot, so the OS prompt covers the
      # screen before the tour can resume behind it
      - runFlow:
          file: ../_shared/settle-after-launch.yml
          label: Back on the dashboard with the session intact

- scrollUntilVisible:
    element:
      text: Trailmarks
    direction: DOWN
    timeout: 20000
- tapOn:
    text: Trailmarks
- waitForAnimationToEnd:
    timeout: 5000
# the page asks again on mount, so the prompt is back on top of the recovery UI. same shape as
# settle-after-launch, scoped to this assertion: dismiss whatever is covering the screen, re-check,
# and let the retry absorb a prompt that lands late or a second time
- retry:
    maxRetries: 3
    commands:
      # dismissed twice per pass: refusing the prompt resumes the app, which re-requests and can
      # raise another one, and maxRetries is capped at 3
      - runFlow:
          when:
            visible:
              text: Don.t allow
          commands:
            - tapOn:
                text: Don.t allow
            - waitForAnimationToEnd:
                timeout: 5000
      - runFlow:
          when:
            visible:
              text: Don.t allow
          commands:
            - tapOn:
                text: Don.t allow
            - waitForAnimationToEnd:
                timeout: 5000
      - extendedWaitUntil:
          visible: Location Needed
          timeout: 15000
          label: Denied location surfaces the recovery alert, not a spinner forever
- assertVisible:
    text: Re-check Location

# recheckLocation() re-reads the native permission. on iOS the grant lands while the app is
# running, so recovery has to happen in place; android force-stops the process on any runtime
# permission change, so there the same guarantee is only observable across a relaunch. both
# paths end on the identical assertions below
- setLocation:
    latitude: 40.7580
    longitude: -73.9855
    label: Drop the device somewhere with a deterministic fix
- runFlow:
    when:
      platform: iOS
    commands:
      - setPermissions:
          appId: com.earthapp.sky
          permissions:
            location: inuse
      - tapOn:
          text: Re-check Location
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.earthapp.sky
          clearState: false
          permissions:
            location: allow
          label: Relaunch with location granted
      - runFlow:
          file: ../_shared/settle-after-launch.yml
      - scrollUntilVisible:
          element:
            text: Trailmarks
          direction: DOWN
          timeout: 20000
      - tapOn:
          text: Trailmarks
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible:
        text: Close tour
    commands:
      - tapOn:
          text: Close tour
      - waitForAnimationToEnd:
          timeout: 5000

- extendedWaitUntil:
    visible: Be the First to Leave One.
    timeout: 40000
    label: Granted location resolved a fix and the nearby query ran
- assertNotVisible:
    text: Location Needed
