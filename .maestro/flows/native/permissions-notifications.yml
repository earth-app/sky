appId: com.earthapp.sky
name: Denied Notifications Must Not Stall The Boot Chain
tags:
  - gate
---
- runFlow:
    file: ../_shared/sign-in.yml

# initPushNotifications() runs inside app.vue's onMounted after the auth await; a denied
# registration there once dropped tokens silently, and a throw would hang the splash
- setPermissions:
    appId: com.earthapp.sky
    permissions:
      notifications: deny
    label: Revoke push before a cold launch

- stopApp:
    appId: com.earthapp.sky
# the map is required, not decorative: launchApp grants everything unless told otherwise, so
# without it the revoke above is undone and this "denied" launch runs fully granted
- launchApp:
    appId: com.earthapp.sky
    clearState: false
    permissions:
      notifications: deny
    label: Cold launch with push registration guaranteed to fail

# initPushNotifications() re-requests, so the OS prompt covers the booting dashboard - twice, since
# it asks again after being refused
- runFlow:
    file: ../_shared/settle-after-launch.yml
    label: Splash cleared and the dashboard rendered despite the denial
- assertNotVisible:
    text: Find your Novelty, Try New Things, Discover the World
    label: Session survived, so no bounce back to the anonymous index

- tapOn:
    text: Notifications
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        text: Close tour
    commands:
      - tapOn:
          text: Close tour
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible: You're all caught up
    timeout: 30000
    label: In-app inbox works with OS notifications denied

- setPermissions:
    appId: com.earthapp.sky
    permissions:
      notifications: allow
- stopApp:
    appId: com.earthapp.sky
- launchApp:
    appId: com.earthapp.sky
    clearState: false
    permissions:
      notifications: allow
    label: Cold launch with push granted
- runFlow:
    file: ../_shared/settle-after-launch.yml
    label: Granted path boots identically
