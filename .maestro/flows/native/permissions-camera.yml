appId: com.earthapp.sky
name: Camera Plugin Bridge With Media Access Revoked
tags:
  - gate
---
- runFlow:
    file: ../_shared/sign-in.yml

# camera plus both photo-library service names; each platform ignores the keys it does not own
- runFlow:
    when:
      platform: iOS
    commands:
      - setPermissions:
          appId: com.earthapp.sky
          permissions:
            camera: deny
            photos: deny
            medialibrary: deny
          label: Revoke every @capacitor/camera-backed permission
# android force-stops a process whose runtime permissions change, and launchApp grants everything
# unless this map says otherwise, so the state and the relaunch are one step
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.earthapp.sky
          clearState: false
          permissions:
            camera: deny
            photos: deny
            medialibrary: deny
          label: Relaunch with every camera-backed permission revoked
      - runFlow:
          file: ../_shared/settle-after-launch.yml
          label: Back on the dashboard with the session intact

- tapOn:
    text: Create Content
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: New Event
- extendedWaitUntil:
    visible: .*Create Event.*
    timeout: 20000

- scrollUntilVisible:
    element:
      text: Choose Thumbnail
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    text: Thumbnail preview
    label: No image before the picker runs

- tapOn:
    text: Choose Thumbnail
    label: Hand off to the native picker with media access revoked

# the two platforms genuinely diverge here, so the assertion has to as well.
#
# ios: the plugin refuses at the bridge and raises its own UIAlertController instead of opening a
# picker, and surfacing that denial rather than failing silently is the whole point of this path.
#
# android: since api 33 the system photo picker is permission-FREE by design - it returns only the
# item the user picks, so it grants access per-selection and revoking READ_MEDIA_IMAGES cannot
# block it. the picker opens normally (measured: "Photos" / "No photos yet" on a revoked run), so
# there is no denial to assert. what still has to hold is that backing out of it leaves the form
# intact, which is what the shared assertions below check
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: .*Access to the photos has been prohibited.*
          timeout: 30000
          label: Plugin surfaced the OS denial instead of failing silently
      - tapOn:
          text: OK
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 5000
          label: Dismissed the permission-free system picker without choosing anything

# a refused pick must leave the form usable and unpopulated, never a half-torn-down
# webview or a Choose Thumbnail button stuck in its loading state
- extendedWaitUntil:
    visible: Choose Thumbnail
    timeout: 30000
    label: Form survived the refused round trip
- assertNotVisible:
    text: Thumbnail preview
- assertVisible:
    text: .*Create Event.*

# ios re-grants in place, so the open form is still there. android force-stops the process on a
# permission change and takes the modal with it, so walk back to the same control rather than
# dropping the assertion; both platforms end on the identical check below
- runFlow:
    when:
      platform: iOS
    commands:
      - setPermissions:
          appId: com.earthapp.sky
          permissions:
            camera: allow
            photos: allow
            medialibrary: allow
- runFlow:
    when:
      platform: Android
    commands:
      # stated explicitly rather than leaning on launchApp's grant-everything default, so the
      # intent survives a maestro change and reads the same as the revoke above
      - launchApp:
          appId: com.earthapp.sky
          clearState: false
          permissions:
            camera: allow
            photos: allow
            medialibrary: allow
          label: Relaunch with camera-backed permissions re-granted
      - runFlow:
          file: ../_shared/settle-after-launch.yml
      - tapOn:
          text: Create Content
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          text: New Event
      - extendedWaitUntil:
          visible: .*Create Event.*
          timeout: 20000
      - scrollUntilVisible:
          element:
            text: Choose Thumbnail
          direction: DOWN
          timeout: 20000
- assertVisible:
    text: Choose Thumbnail
    label: Control still live after re-granting
