appId: com.earthapp.sky
name: Quest Step Sheet Opens From A Timeline Tile
tags:
  - gate
---
- runFlow:
    file: ../_shared/sign-in.yml

# discover first: the dashboard explore strip also carries a "Quests" accessible name, so the
# tab-bar button is only unambiguous once the dashboard is off screen
- tapOn:
    text: Discover
# ion-searchbar hardcodes aria-label="search text", so the "Explore..." placeholder is not
# reachable on android; the selected tab is what proves the route committed
- extendedWaitUntil:
    visible:
      text: Discover
      selected: true
    timeout: 20000
- tapOn:
    text: Quests
- extendedWaitUntil:
    visible: Challenge a Friend
    timeout: 20000
    label: Quests tab rendered, which is the only surface that fetches the catalog

# the dashboard never fetches the catalog itself; its Today card reads the same pinia store,
# so on a wiped container the daily pick can only resolve after the quests tab has filled it
- tapOn:
    text: Dashboard
- extendedWaitUntil:
    visible: Time Outside
    timeout: 20000
- extendedWaitUntil:
    notVisible: Browse Quests
    timeout: 30000
    label: Catalog reached the dashboard, so the Today cta opens a quest instead of the list

# "Continue Quest" when a quest is already active, "Start Today's Quest" otherwise; both land
# on a quest detail page, so the pair covers either mock state
- runFlow:
    when:
      visible:
        text: "Start Today's Quest"
    commands:
      - tapOn:
          text: "Start Today's Quest"
- runFlow:
    when:
      visible:
        text: Continue Quest
    commands:
      - tapOn:
          text: Continue Quest
- waitForAnimationToEnd:
    timeout: 5000

# every tile in MTimeline is a UBadge whose only accessible name is `Step <n>`; nothing below
# this line was reachable before that label existed
- extendedWaitUntil:
    visible: Step 1
    timeout: 40000
    label: Quest timeline rendered with a named first step

- runFlow:
    when:
      visible:
        text: Start Quest
    commands:
      - tapOn:
          text: Start Quest
      - extendedWaitUntil:
          visible: End Quest
          timeout: 30000
          label: Quest started, so the timeline switched to its active state
# tapping End Quest from here is deliberately not attempted: MTimeline awaits the native
# "Quest started!" toast before clearing `loading`, the button is disabled for that whole
# window, and the toast label never reaches the accessibility tree, so there is no signal
# to wait on. the same confirm bridge is covered from settings instead
- assertVisible:
    text: End Quest
    label: This quest is the active one, whichever branch got us here

# the reward tile is the last thing in the timeline and hydrates on visibility, so reaching it
# proves the whole list mounted rather than only the first screenful
- scrollUntilVisible:
    element:
      text: Quest Reward
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: Quest Reward
    label: Reward tile hydrated with its accessible name
- scrollUntilVisible:
    element:
      text: Step 1
    direction: UP
    timeout: 30000

# the step sheet is deliberately the last thing this flow touches. closing it strands the
# webview: ion-modal sets aria-hidden on the app root, and quests/[id].vue nulls `openStep`
# in the same tick as `stepOpen`, so the element is destroyed before ionic's dismiss can
# clear it. everything stays on screen and tappable, but the accessibility tree is empty
# until a relaunch, so no assertion after a close could be trusted
- tapOn:
    text: Step 1
- extendedWaitUntil:
    visible: Close quest step
    timeout: 30000
    label: Step sheet opened from the tile
- assertVisible:
    text: '.*Step #1.*'
    label: Sheet header names the step the tile stood for
- assertNotVisible:
    text: Start this quest to unlock the step interface.
    label: Step interface is live on the active quest, not gated behind starting it
