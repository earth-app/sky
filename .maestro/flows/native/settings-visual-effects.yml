appId: com.earthapp.sky
name: Settings Reachable From The Profile Header
tags:
  - gate
---
- runFlow:
    file: ../_shared/sign-in.yml

- tapOn:
    text: Profile
- extendedWaitUntil:
    visible: Edit Profile
    timeout: 20000
    label: Profile tab rendered

# the header's settings control is an icon-only IonButton, so its aria-label is the only way in
- tapOn:
    text: Settings
- extendedWaitUntil:
    visible: Appearance
    timeout: 30000
    label: Settings list rendered from the profile header
- assertVisible:
    text: Theme

# the select is an IonSelect with a fixed label, so "Visual Effects" is real rendered text
# rather than the host aria-label ionic drops
- scrollUntilVisible:
    element:
      text: Visual Effects
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Visual Effects
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: Reduced
    timeout: 20000
    label: Popover interface presented the tier options
- tapOn:
    text: Reduced
- waitForAnimationToEnd:
    timeout: 5000
# a closed ion-select composes its accessible name as "<label>, <value>", so the bare value
# never full-matches; the open option list above does expose the value on its own
- assertVisible:
    text: '.*Reduced.*'
    label: The select is showing the explicit tier it just took
- assertNotVisible:
    text: Full
    label: Popover dismissed, so this is the select value and not an open option list

# the action re-runs the frame probe on the real device; the toast names the tier it measured,
# which a simulator can only produce by actually timing frames
- scrollUntilVisible:
    element:
      text: Re-check This Device
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Re-check
    label: Re-measure this device
- extendedWaitUntil:
    visible: .*Visual effects re-measured.*
    timeout: 30000
    label: Probe finished and reported the tier it picked

# restore the measured default, which also asserts the Automatic option carries the fresh label
- scrollUntilVisible:
    element:
      text: Visual Effects
    direction: UP
    timeout: 30000
- tapOn:
    text: Visual Effects
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: Automatic \(.*\)
    timeout: 20000
    label: Automatic names the tier the probe measured, not a guess
- tapOn:
    text: Automatic \(.*\)
- waitForAnimationToEnd:
    timeout: 5000
# closed again, so the name is "<label>, <value>" rather than the bare option text above
- assertVisible:
    text: .*Automatic \(.*\).*
    label: Back on the measured default

# a destructive settings action confirms through a native @capacitor/dialog alert; cancelling
# proves that bridge answers on device and leaves the log files alone
- scrollUntilVisible:
    element:
      text: Clear Logs
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Clear
    label: Ask to erase the local logs
- extendedWaitUntil:
    visible: .*erase all local log files.*
    timeout: 20000
    label: Native confirm presented its warning instead of erasing straight away
- tapOn:
    text: Cancel
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: Clear Logs
    label: Cancelling came back to the settings row with the webview intact
