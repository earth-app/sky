appId: com.earthapp.sky
name: Simulated Movement Through The Geolocation Bridge
tags:
  - gate
---
- runFlow:
    file: ../_shared/sign-in.yml

# simctl privacy takes the CLLocation vocabulary for `location`; android's appops takes allow
- runFlow:
    when:
      platform: iOS
    commands:
      - setPermissions:
          appId: com.earthapp.sky
          permissions:
            location: inuse
- runFlow:
    when:
      platform: Android
    commands:
      - setPermissions:
          appId: com.earthapp.sky
          permissions:
            location: allow
- setLocation:
    latitude: 40.7580
    longitude: -73.9855

- scrollUntilVisible:
    element:
      text: Trailmarks
    direction: DOWN
    timeout: 20000
- tapOn:
    text: Trailmarks
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        text: Close tour
    commands:
      - tapOn:
          text: Close tour
      - waitForAnimationToEnd:
          timeout: 5000

- extendedWaitUntil:
    visible: Be the First to Leave One.
    timeout: 40000
    label: Initial fix resolved through @capacitor/geolocation

# travel replays a real CoreLocation/LocationManager update stream, which re-fires the
# lat/lng watcher and the radius-scoped nearby query on every point
- travel:
    points:
      - 40.7580,-73.9855
      - 40.7605,-73.9840
      - 40.7630,-73.9825
      - 40.7655,-73.9810
    speed: 6
    label: Walk four points north-east through Midtown

- extendedWaitUntil:
    visible: Trailmarks Nearby
    timeout: 20000
    label: Surface survived a live position stream
- assertNotVisible:
    text: Location Needed
- assertVisible:
    text: Within
    label: Radius selector still bound after the position churn
